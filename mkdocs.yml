site_name: Open Source Monorepo
site_description: A collection of open-source projects and utilities
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Developer Guide: dev-guide.md
  - Splitting Projects: splitting.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true
