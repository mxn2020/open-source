name: summarize
description: A prompt for summarizing long documents into concise summaries.
metadata:
  model: gpt-4
  temperature: "0.3"
  max_tokens: "500"
content: |
  You are a summarization expert. Given the following document, produce a
  concise summary that captures the key points. The summary should be no
  longer than 3 paragraphs. Focus on the most important information and
  maintain the original tone.
