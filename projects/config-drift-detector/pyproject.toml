[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "config-drift-detector"
version = "0.1.0"
description = "Detect configuration drift between two sources (YAML, JSON, TOML)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Config Drift Detector Contributors" },
]
keywords = ["configuration", "drift", "detection", "yaml", "json", "toml", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
drift = "config_drift_detector.cli:app"

[project.urls]
Homepage = "https://github.com/github/open-source/tree/main/projects/config-drift-detector"
Issues = "https://github.com/github/open-source/issues"

# -- Tool configuration -----------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
