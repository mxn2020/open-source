# Target configuration (source B) — has some drift from config_a.yaml
database:
  host: db.prod.internal
  port: 5432
  name: myapp_db
  ssl: true

cache:
  backend: redis
  host: cache.prod.internal
  port: 6379
  ttl: 600

logging:
  level: warning
  format: json
  output: /var/log/myapp.log

feature_flags:
  dark_mode: true
  beta_api: false
  new_dashboard: true
