[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-reviewer-bot"
version = "0.1.0"
description = "A CLI tool that provides automated PR review suggestions by analyzing diffs."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
]

[project.scripts]
pr-reviewer = "pr_reviewer_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99

[tool.black]
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
