name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - config-drift-detector
          - pr-reviewer-bot
          - dotenv-doctor
          - feature-flag-service
          - prompt-version-control
          - model-output-evaluator
          - retry-with-backoff
          - error-log-summarizer
          - good-first-issue-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.project }}-${{ hashFiles(format('projects/{0}/pyproject.toml', matrix.project)) }}

      - name: Install dependencies
        working-directory: projects/${{ matrix.project }}
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: projects/${{ matrix.project }}
        run: python -m ruff check src/ tests/

      - name: Check formatting with black
        working-directory: projects/${{ matrix.project }}
        run: python -m black --check src/ tests/

      - name: Run tests
        working-directory: projects/${{ matrix.project }}
        run: python -m pytest tests/ -v --cov --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: projects/${{ matrix.project }}/coverage.xml

  ts-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - api-rate-limit-visualizer
          - timezone-safe-date-utils
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ matrix.project }}-${{ hashFiles(format('projects/{0}/pnpm-lock.yaml', matrix.project)) }}

      - name: Install dependencies
        working-directory: projects/${{ matrix.project }}
        run: pnpm install

      - name: Lint
        working-directory: projects/${{ matrix.project }}
        run: pnpm lint

      - name: Test
        working-directory: projects/${{ matrix.project }}
        run: pnpm test

      - name: Build
        working-directory: projects/${{ matrix.project }}
        run: pnpm build
